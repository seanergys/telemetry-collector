log_level: debug

sensor_templates:
  defaults:
    interval_ms: 1000
    description: template description
    unit: template unit
    factor: 2.5
    offset: -1.5
    topic: template topic
    filter: template filter
    nameserver_parts:
      hostname: template host
      shared: template

sensor_groups:
  example:
    template: defaults
    interval_ms: 2000
    description: group description
    topic: group topic
    filter: group filter
    nameserver_parts:
      rack: rack 1
      shared: group
    sensors:
      - uuid: 11111111-1111-4111-8111-111111111111
        interval_ms: 250
        topic: sensor topic
        filter: sensor filter
        nameserver_parts:
          metric: cpu
          shared: sensor

      - unit: percent
        nameserver_parts:
          metric: memory