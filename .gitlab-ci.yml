variables:
  SEANERBUS_COMMIT:
    value: "3075f14aa9b75ac8020d8a4c0dd09f7dae3c251d"
    description: "seanerbus main commit"
  SCHEMA_COMMIT:
    value: "4bfb120b8c9c55c60abd326fe9b759e5d33cc939"
    description: "Cap'n Proto message definition commit"
  TC_PLUGINS:
    value: "tester;sysfs;mock;snmp"
    description: "tc plugins to test"

stages:
  - deps
  - pkgdeps
  - build
  - test

pkgdeps:
  image: debian:testing-slim
  stage: pkgdeps
  script:    
    - ls
    - pwd
    - apt-get update && apt-get install -y git cmake capnproto libcapnp-dev build-essential libyaml-cpp-dev snmp snmpd libsnmp-dev  catch2 libcatch2-dev pkg-config  file uuid-dev
    - rm -rf seanerbus-cpp
    - git clone https://software_token:$software_token@gitlab.seanergys.fz-juelich.de/software/seanerbus-cpp.git
    - cd seanerbus-cpp
    - if [ -n "$SEANERBUS_COMMIT" ]; then git checkout $SEANERBUS_COMMIT; fi
    - git clone https://software_token:$software_token@gitlab.seanergys.fz-juelich.de/software/seanerbus-msg.git schemas
    - if [ -n "$SCHEMA_COMMIT" ]; then cd schemas && git checkout $SCHEMA_COMMIT && cd ..; fi
    - git clone --branch 12.2.0 --depth 1 https://github.com/fmtlib/fmt.git lib/fmt
    - mkdir build
    - cd build
    - cmake .. -DCMAKE_INSTALL_PREFIX=../../install -DCMAKE_POSITION_INDEPENDENT_CODE=ON
    - make -j4 install VERBOSE=1
  artifacts:
    paths:
      - install/
    expire_in: 1 hour


build:
  image: debian:testing-slim
  stage: build
  needs: ["pkgdeps"]
  script:
    - ls
    - apt-get update && apt-get install -y git cmake capnproto libcapnp-dev build-essential libyaml-cpp-dev snmp snmpd libsnmp-dev  catch2 libcatch2-dev pkg-config file uuid-dev 
    - mkdir build && cd build
    - cmake -DSELECTED_PLUGINS="$TC_PLUGINS" -DSEANERBUS_ROOT=../install -DCAPNP_ROOT=/usr -DCMAKE_INSTALL_PREFIX=../install  -DSPDLOG_FMT_EXTERNAL=ON -DUUID_ROOT=/usr  .. 
    - make -j4 install  VERBOSE=1
    - ls
  artifacts:
    paths:
      - "**/*"
    expire_in: 1 hour


test:
  image: debian:testing-slim
  stage: test
  script:
    - cd install
    - test -f bin/telemetry_collector|| (echo "missing bin/telemetry_collector"; exit 1)
    - PLUGIN_INSTALL_DIR="lib/telemetry_collector/plugins" 
    - |
      for p in $(echo "$TC_PLUGINS" | tr ';' ' '); do
        test -f "$PLUGIN_INSTALL_DIR/$p.so" || { echo "missing $PLUGIN_INSTALL_DIR/$p.so"; exit 1; }
      done
  artifacts:
    paths:
      - "**/*"
    expire_in: 1 hour
