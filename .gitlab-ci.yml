variables:
  SEANERBUS_COMMIT:
    value: "1b20571854fe45c13bdef687e26f04cd4d272bb2"
    description: "seanerbus main commit"

stages:
  - deps
  - pkgdeps
  - build
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

pkgdeps:
  image: debian:testing-slim
  stage: pkgdeps
  script:    
    - ls
    - pwd
    - apt-get update && apt-get install -y git cmake capnproto libcapnp-dev build-essential libyaml-cpp-dev snmp snmpd libsnmp-dev  catch2 libcatch2-dev pkg-config  file
    - rm -rf seanerbus-cpp
    - git clone https://software_token:$software_token@gitlab.seanergys.fz-juelich.de/software/seanerbus-cpp.git
    - cd seanerbus-cpp
    - if [ -n "$SEANERBUS_COMMIT" ]; then git checkout $SEANERBUS_COMMIT; fi
    - git clone https://software_token:$software_token@gitlab.seanergys.fz-juelich.de/software/seanerbus-msg.git schemas
    - cd schemas && git checkout 9f9c214 && cd ..
    - git clone https://github.com/fmtlib/fmt.git lib/fmt
    - mkdir build
    - cd build
    - cmake .. -DCMAKE_INSTALL_PREFIX=../install -DCMAKE_POSITION_INDEPENDENT_CODE=ON
    - make -j4 install
  artifacts:
    paths:
      - seanerbus-cpp/
    expire_in: 1 hour


build:
  image: debian:testing-slim
  stage: build
  needs: ["pkgdeps"]
  script:
    - ls
    - apt-get update && apt-get install -y git cmake capnproto libcapnp-dev build-essential libyaml-cpp-dev snmp snmpd libsnmp-dev  catch2 libcatch2-dev pkg-config file 
    - mkdir build && cd build
    - cmake -DPLUGINS="tester;sysfs;mock" -DSEANERBUS_ROOT=../seanerbus-cpp/install -DCAPNP_ROOT=/usr -DCMAKE_INSTALL_PREFIX=../install ..
    - make -j4 install
    - ls
  artifacts:
    paths:
      - "**/*"
    expire_in: 1 hour


test:
  image: debian:testing-slim
  stage: test
  script:
    - cd install
    - ls
    - test -f bin/telemetry_collector|| (echo "missing bin/telemetry_collector"; exit 1)
    
    - plugin_install_dir="lib/telemetry_collector/plugins" 
    - test -f "$plugin_install_dir/tester.so" || (echo "missing $plugin_install_dir/tester.so"; exit 1)
    - test -f "$plugin_install_dir/sysfs.so" || (echo "missing $plugin_install_dir/sysfs.so"; exit 1)
    - test -f "$plugin_install_dir/snmp.so" || (echo "missing $plugin_install_dir/snmp.so"; exit 1)
  artifacts:
    paths:
      - "**/*"
    expire_in: 1 hour
