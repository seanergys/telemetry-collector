stages:
  - deps
  - pkgdeps
  - build
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

pkgdeps:
  image: debian:testing-slim
  stage: pkgdeps
  script:    
    - ls
    - pwd
    - apt-get update && apt-get install -y git cmake capnproto libcapnp-dev build-essential libyaml-cpp-dev snmp snmpd libsnmp-dev  catch2 libcatch2-dev pkg-config 
    - rm -rf seanerbus-cpp
    - git clone https://software_token:$software_token@gitlab.seanergys.fz-juelich.de/software/seanerbus-cpp.git
    - cd seanerbus-cpp
    - git clone https://software_token:$software_token@gitlab.seanergys.fz-juelich.de/software/seanerbus-msg.git schemas
    - git clone https://github.com/fmtlib/fmt.git lib/fmt
    - mkdir build
    - cd build
    - cmake .. -DCMAKE_INSTALL_PREFIX=../install_seanerbus -DCMAKE_POSITION_INDEPENDENT_CODE=ON
    - make -j install
  artifacts:
    paths:
      - seanerbus-cpp/
    expire_in: 1 hour


build:
  image: debian:testing-slim
  stage: build
  needs: ["pkgdeps"]
  script:
    - ls
    - apt-get update && apt-get install -y git cmake capnproto libcapnp-dev build-essential libyaml-cpp-dev snmp snmpd libsnmp-dev  catch2 libcatch2-dev pkg-config 
    - export make_for="CI"
    - make -j 
    - ls
  artifacts:
    paths:
      - "**/*"
    expire_in: 1 hour


test:
  image: debian:testing-slim
  stage: test
  script:
    - test -f telemetry-collector || -f plugins/sysfs.so || test -f plugins/tester.so || exit 1
  artifacts:
    paths:
      - "**/*"
    expire_in: 1 hour
