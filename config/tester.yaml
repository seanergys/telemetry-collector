name: tester
uuid: e94e6e91-a83d-4e04-a147-aab3860d0cd7
log_level: INFO

sensor_templates:
  temp: 
    interval_ms: 5000
    factor: 0.001
    nameserver_parts:
      socket: 1

sensor_groups:
  tester1:
    uuid: 3bc3d210-a49f-4422-8fe8-26ca480d0e1f # batching -> true
    template: temp

    sensors:
      - uuid: 7bc3d210-a49f-4422-8fe8-26ca480d0e1a
        nameserver_parts:
          metric: temperature
        interval_ms: 1000
        unit: C

      - uuid: 7bc3d210-a49f-4422-8fe8-26ca480d0e1b
        nameserver_parts:
          metric: humidity
        interval_ms: 1000
        unit: "%"

      - uuid: 7bc3d210-a49f-4422-8fe8-26ca480d0e1c
        nameserver_parts:
          metric: pressure
        interval_ms: 5000
        unit: hPa

      - uuid: 7bc3d210-a49f-4422-8fe8-26ca480d0e1f
        nameserver_parts:
          metric: flow
        interval_ms: 5000
        unit: l/min
